<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opção Lanche Delivery Control</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#14202b">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#5b6b79;--line:#d5dce2;--pan:#fff;--ac:#0f766e}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}#root{height:100%}
body{font:14px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:#b91c1c}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
#app{display:grid;grid-template-columns:410px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--ink);color:#fff}
header b{font-size:16px}header span{opacity:.7;font-size:12px}header .sp{flex:1}
header button{background:transparent;color:#fff;border-color:#ffffff55}
aside{background:var(--pan);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:9px;background:none;border-bottom:3px solid transparent}
.tabs button.on{border-bottom-color:var(--ac);font-weight:600}
.pane{overflow:auto;flex:1;padding:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tools input{flex:1;min-width:120px}
.o{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:6px}
.o:hover{border-color:var(--ac)}.o.act{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.o.sel{background:#e6f4f1}.o small{color:var(--mut)}
.bd{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;white-space:nowrap}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:5px 8px;margin:5px 0;font-size:12px}
.pend{background:#fee2e2;border:1px solid #f87171;border-radius:6px;padding:2px 6px;font-size:11px}
.det{border-top:1px solid var(--line);padding:10px;background:#f8fafb;max-height:42%;overflow:auto}
.rt{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.rt h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:6px}
.st{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px dashed var(--line)}
.st i{font-style:normal;background:var(--ink);color:#fff;border-radius:50%;min-width:20px;height:20px;text-align:center;font-size:12px;line-height:20px}
.st div{flex:1}.st button{padding:1px 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#map{height:100%;width:100%;z-index:1}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative}
.leaflet-tile{filter:inherit;visibility:inherit;margin:0!important;padding:0!important;max-width:none!important;max-height:none!important}
.num{background:var(--ink);color:#fff;border-radius:50%;text-align:center;font-weight:700;font-size:12px;line-height:22px;border:2px solid #fff;width:26px!important;height:26px!important}
.bar{position:absolute;z-index:500;left:60px;top:10px;background:#fff;border-radius:8px;padding:6px 10px;box-shadow:0 1px 6px #0003;font-size:12px}
.leg{position:absolute;z-index:500;right:10px;bottom:24px;background:#fff;border-radius:8px;padding:6px 10px;box-shadow:0 1px 6px #0003;font-size:12px}
.leg div{display:flex;gap:6px;align-items:center}.leg s{width:10px;height:10px;border-radius:50%;display:inline-block}
#mapwrap{position:relative;min-height:0;height:100%;width:100%}
.empty{color:var(--mut);padding:14px;text-align:center}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 45vh 1fr}header{grid-column:1}aside{order:3}}
/* entregador: a página precisa rolar (o painel admin usa tela fixa) */
html.drvpage,html.drvpage body{height:auto;min-height:100%;overflow:auto}html.drvpage #root{height:auto}
.drv{max-width:520px;margin:0 auto;padding:12px}.drv .rt{background:#fff}
.drv #dmap{height:40vh;min-height:240px;border-radius:8px;margin:8px 0}
.drv h2{margin:6px 0}
.drv #dmap.dfull{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100vh;min-height:0;margin:0;border-radius:0;z-index:1000}
#dmap .dfi{display:none;background:#fffbeb;border:1px solid #f59e0b;border-radius:8px;padding:6px 10px;max-width:72vw;font-size:13px;box-shadow:0 1px 6px #0004}
#dmap.dfull .dfi{display:block}
#dmap .dfs{padding:9px 12px;font-weight:600;box-shadow:0 1px 6px #0004}
.drv .row button{flex:1;padding:10px}

/* login, formulários e avisos */
.login{max-width:340px;margin:12vh auto;padding:20px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.login h2{margin:0}.login input{padding:9px}.login button{padding:9px}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:#0007;z-index:2000;display:flex;align-items:center;justify-content:center;padding:12px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
#modal h3{margin:0 0 6px}
#modal label{display:block;margin:6px 0;font-size:12px;color:var(--mut)}
#modal label input,#modal label textarea{display:block;width:100%;margin-top:2px;font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14202b;color:#fff;padding:9px 14px;border-radius:8px;z-index:3000;display:none;max-width:90vw;font-size:13px}
</style></head><body>
<div id="root"></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>/* ===== CONFIGURAÇÃO (chaves públicas: a proteção dos dados é feita pelo login e pelas regras do Supabase) ===== */
const SB_URL='https://mijiqvekuwhvehzfygkt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pamlxdmVrdXdodmVoemZ5Z2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzY1ODYsImV4cCI6MjExMDk1MjU4Nn0.pXt5zzdC5M08yRgtPsU6Q_ZhBkfjZ3q6f5-6v_fYlUw';
const GEO_KEY='0921bc7aa6764c29bfd04f2f70b0d14c'; /* Geoapify */
const useGeo=!!GEO_KEY;
const TILE_URL=useGeo?'https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey='+GEO_KEY:'https://'+'tile.'+'openstreetmap.org/{z}/{x}/{y}.png';
const TILE_OPTS={maxZoom:19,attribution:useGeo?'Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> | © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors':'© OpenStreetMap'};
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:false}});

/* Status iguais aos do CompraAgora */
const ST={preparo:['Em preparo','#d97706'],rota:['Em rota de entrega','#0891b2'],finalizado:['Pedido finalizado','#9ca3af']};
const RST={rascunho:'Rascunho',confirmada:'Confirmada',andamento:'Em andamento',finalizada:'Finalizada',cancelada:'Cancelada'};
const ACTIVE=['rascunho','confirmada','andamento'];
let LOJA={end:'',lat:-3.1019,lng:-60.0250};
let BASE=[LOJA.lat,LOJA.lng];
let S={orders:[],routes:[]};
let DRIVERS=[];
const pad=n=>String(n).padStart(2,'0');
const fmtHora=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const hora=()=>fmtHora(Date.now());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- conversão banco <-> app ---------- */
const orderFromDb=r=>({id:r.id,num:r.num,nome:r.nome,tel:r.tel,end:r.endereco,bairro:r.bairro,ref:r.ref,itens:r.itens,hora:fmtHora(r.created_at),t:Date.parse(r.created_at),status:r.status,lat:r.lat,lng:r.lng,pend:r.lat==null,routeId:r.route_id,driver:r.driver_id,obs:r.obs});
const orderToDb=o=>({id:o.id,num:o.num,nome:o.nome,tel:o.tel??null,endereco:o.end??null,bairro:o.bairro??null,ref:o.ref??null,itens:o.itens??null,status:o.status,lat:o.lat??null,lng:o.lng??null,obs:o.obs||null,route_id:o.routeId||null,driver_id:o.driver||null});
const routeFromDb=r=>({id:r.id,driver:r.driver_id,ids:r.ids||[],status:r.status,t:Date.parse(r.created_at)});
const routeToDb=r=>({id:r.id,driver_id:r.driver||null,ids:r.ids,status:r.status});
const driverFromDb=d=>({id:d.id,nome:d.nome,tel:d.tel,token:d.token,ativo:d.ativo});

const O=id=>S.orders.find(o=>o.id===id), R=id=>S.routes.find(r=>r.id===id);
/* pedido livre = sem rota e ainda não finalizado */
const free=o=>!o.routeId&&o.status!=='finalizado';
const hav=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const pt=o=>[o.lat,o.lng];
const fullEnd=o=>(o.end||'')+(o.bairro&&!String(o.end||'').toLowerCase().includes(String(o.bairro).toLowerCase())?' - '+o.bairro:'');
const pendStops=r=>r.ids.map(O).filter(o=>o&&o.lat!=null&&o.status!=='finalizado');
function stats(r){let p=BASE,d=0;const ids=pendStops(r);ids.forEach(o=>{d+=hav(p,pt(o));p=pt(o)});d*=1.3;return{km:d,min:Math.round(d/25*60+3*ids.length)}}
function suggest(ids){let left=ids.map(O).filter(Boolean),p=BASE,out=[];const nl=left.filter(o=>o.lat==null);left=left.filter(o=>o.lat!=null);
 while(left.length){left.sort((a,b)=>hav(p,pt(a))-hav(p,pt(b)));const n=left.shift();out.push(n.id);p=pt(n)}return out.concat(nl.map(o=>o.id))}
function gmaps(o){return 'https://www.google.com/maps/dir/?api=1&destination='+(o.lat!=null?o.lat+','+o.lng:encodeURIComponent(fullEnd(o)+', Manaus - AM'))}
const badge=s=>{const x=ST[s]||['?','#999'];return `<span class="bd" style="background:${x[1]}">${x[0]}</span>`};
/* rota some para "finalizada" quando todos os pedidos dela foram finalizados */
function syncRoute(r){
 if(!['confirmada','andamento'].includes(r.status))return;
 const os=r.ids.map(O).filter(Boolean);
 if(os.length&&os.every(o=>o.status==='finalizado'))r.status='finalizada';
}
const numIcon=(n,col)=>L.divIcon({className:'',html:`<div class="num" ${col?`style="background:${col}"`:''}>${n}</div>`,iconSize:[26,26]});
function toast(m,err){const el=document.getElementById('toast');el.textContent=m;el.style.background=err?'#b91c1c':'#14202b';el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{el.style.display='none'},err?6000:2500)}
/* busca de endereço: devolve {lat,lng} ou null */
function geocode(a){
 if(useGeo)return fetch('https://api.geoapify.com/v1/geocode/search?format=json&limit=1&lang=pt&filter=countrycode:br&bias=proximity:'+LOJA.lng+','+LOJA.lat+'&text='+encodeURIComponent(a)+'&apiKey='+GEO_KEY)
  .then(r=>r.json()).then(j=>j.results&&j.results.length?{lat:+j.results[0].lat,lng:+j.results[0].lon}:null);
 return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(a))
  .then(r=>r.json()).then(j=>j.length?{lat:+j[0].lat,lng:+j[0].lon}:null);
}

/* ---------- gravação no banco (fila, só envia o que mudou) ---------- */
const snap={o:new Map(),r:new Map()};
const snapAll=()=>{snap.o.clear();snap.r.clear();S.orders.forEach(x=>snap.o.set(x.id,JSON.stringify(orderToDb(x))));S.routes.forEach(x=>snap.r.set(x.id,JSON.stringify(routeToDb(x))))};
let busy=0,needReload=false,pushChain=Promise.resolve(),reloadFn=()=>{};
function queue(fn){
 busy++;
 pushChain=pushChain.then(fn).catch(e=>{toast('Não foi possível salvar: '+(e&&e.message||e),true);needReload=true})
  .finally(()=>{busy--;if(!busy&&needReload){needReload=false;reloadFn()}});
}
async function push(){
 const rr=S.routes.map(routeToDb).filter(x=>snap.r.get(x.id)!==JSON.stringify(x));
 const oo=S.orders.map(orderToDb).filter(x=>snap.o.get(x.id)!==JSON.stringify(x));
 if(rr.length){const {error}=await sb.from('routes').upsert(rr);if(error)throw error;rr.forEach(x=>snap.r.set(x.id,JSON.stringify(x)))}
 if(oo.length){const {error}=await sb.from('orders').upsert(oo);if(error)throw error;oo.forEach(x=>snap.o.set(x.id,JSON.stringify(x)))}
}
const save=()=>{S.routes.forEach(syncRoute);queue(push)};
function saveLoja(){BASE=[LOJA.lat,LOJA.lng];queue(async()=>{const {error}=await sb.from('loja').upsert({id:1,endereco:LOJA.end||null,lat:LOJA.lat,lng:LOJA.lng});if(error)throw error})}

/* ================= ENTREGADOR ================= */
if(location.hash.startsWith('#entregador=')){
 document.documentElement.classList.add('drvpage');
 const token=location.hash.split('=')[1];
 let D=null,did=null,dm,dLayer,dMk,dMe,dPos=null,dLastPos=null,dLast=0,dSig='',dSeq=0,dFit=true,dTxt='',dGeo='',dTail=null,dHash='',dShell=false;
 const root=document.getElementById('root');
 root.innerHTML='<div class="drv"><h2>Carregando…</h2></div>';
 const dRoutes=()=>S.routes.filter(r=>r.driver===did&&['confirmada','andamento'].includes(r.status));
 const dStops=()=>{const out=[];dRoutes().forEach(r=>r.ids.forEach(id=>{const o=O(id);if(o&&o.status!=='finalizado'&&o.lat!=null)out.push(o)}));return out};
 const setInfo=()=>{const el=document.getElementById('dinfo');if(!el)return;const t=(dTxt||'')+(dGeo?(dTxt?'<br>':'')+'<small>'+dGeo+'</small>':'');el.hidden=!t;el.innerHTML=t;document.querySelectorAll('.dfi').forEach(e=>{e.innerHTML=t})};
 function drawRoute(ll,legKm,legMin,totKm,totMin,approx){
  dLayer.clearLayers();
  L.polyline(ll,{color:'#fff',weight:10,opacity:.9}).addTo(dLayer);
  const pl=L.polyline(ll,{color:'#2563eb',weight:6,opacity:.95,dashArray:approx?'8 8':null}).addTo(dLayer);
  if(dFit){dFit=false;dm.fitBounds(pl.getBounds().extend(dPos||BASE),{padding:[30,30]})}
  const n=dStops()[0];
  dTxt=n?(`<b>Próxima: #${esc(n.num)} ${esc(n.nome)}</b>`+(legKm!=null?` · ${legKm.toFixed(1)} km · ${Math.max(1,Math.round(legMin))} min<br><small>Rota completa: ${totKm.toFixed(1)} km · ~${Math.max(1,Math.round(totMin))} min (trânsito não considerado)</small>`:'')+(approx?'<br><small>Rota aproximada (linha reta): não foi possível consultar o serviço de rotas.</small>':'')):'';
  setInfo();
 }
 function routeCall(pts){
  if(useGeo)return fetch('https://api.geoapify.com/v1/routing?mode=drive&waypoints='+pts.map(p=>p[0]+','+p[1]).join('%7C')+'&apiKey='+GEO_KEY)
   .then(r=>r.json()).then(j=>{const f=j.features&&j.features[0];if(!f)throw new Error('sem rota');
    const g=f.geometry,pr=f.properties,lines=g.type==='MultiLineString'?g.coordinates:[g.coordinates],ll=[];
    lines.forEach(seg=>seg.forEach(c=>ll.push([c[1],c[0]])));
    const lg=pr.legs&&pr.legs[0]?pr.legs[0]:pr;
    const legs=(pr.legs&&pr.legs.length===lines.length&&lines.length===pts.length-1)?lines.map((seg,i)=>({ll:seg.map(c=>[c[1],c[0]]),km:pr.legs[i].distance/1000,min:pr.legs[i].time/60})):null;
    return{ll,legs,legKm:lg.distance/1000,legMin:lg.time/60,totKm:pr.distance/1000,totMin:pr.time/60}});
  return fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p[1]+','+p[0]).join(';')+'?overview=full&geometries=geojson')
   .then(r=>r.json()).then(j=>{if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error('sem rota');const rt=j.routes[0];
    return{ll:rt.geometry.coordinates.map(c=>[c[1],c[0]]),legs:null,legKm:rt.legs[0].distance/1000,legMin:rt.legs[0].duration/60,totKm:rt.distance/1000,totMin:rt.duration/60}});
 }
 /* Economia de créditos: a rota completa só é calculada quando a lista de paradas muda.
    Enquanto o entregador anda, só o trecho até a próxima parada é recalculado (1 crédito). */
 function fetchRoute(){
  const stops=dStops();
  if(!stops.length){dLayer.clearLayers();dTxt='';dTail=null;setInfo();return}
  const from=dPos||BASE;dLast=Date.now();dLastPos=from;const my=++dSeq;
  const sig=stops.map(o=>o.id).join(',');
  const live=!!(dTail&&dTail.sig===sig);
  const pts=[from].concat(stops.map(pt));
  if(live){
   routeCall([from,pt(stops[0])]).then(r=>{if(my!==dSeq)return;
    drawRoute(r.ll.concat(dTail.ll),r.legKm,r.legMin,r.legKm+dTail.km,r.legMin+dTail.min,false)})
   .catch(()=>{/* mantém a linha anterior; tenta de novo no próximo movimento */});
   return;
  }
  routeCall(pts).then(r=>{if(my!==dSeq)return;
   dTail=r.legs?{sig,ll:[].concat(...r.legs.slice(1).map(l=>l.ll)),km:r.legs.slice(1).reduce((a,l)=>a+l.km,0),min:r.legs.slice(1).reduce((a,l)=>a+l.min,0)}:null;
   drawRoute(r.ll,r.legKm,r.legMin,r.totKm,r.totMin,false)})
  .catch(()=>{if(my!==dSeq)return;dTail=null;drawRoute(pts,null,null,0,0,true)});
 }
 function updateMap(){
  if(!dm){dm=L.map('dmap').setView(BASE,12);L.tileLayer(TILE_URL,TILE_OPTS).addTo(dm);
   dLayer=L.layerGroup().addTo(dm);dMk=L.layerGroup().addTo(dm);setTimeout(()=>dm.invalidateSize(),200);
   const FS=L.Control.extend({options:{position:'topright'},onAdd(){const b=L.DomUtil.create('button','dfs');b.textContent='⛶ Tela cheia';L.DomEvent.disableClickPropagation(b);
    b.onclick=()=>{const el=document.getElementById('dmap'),on=el.classList.toggle('dfull');b.textContent=on?'✕ Voltar aos pedidos':'⛶ Tela cheia';setTimeout(()=>dm.invalidateSize(),50)};return b}});
   const FI=L.Control.extend({options:{position:'bottomleft'},onAdd(){const d=L.DomUtil.create('div','dfi');L.DomEvent.disableClickPropagation(d);d.innerHTML=dTxt;return d}});
   dm.addControl(new FS());dm.addControl(new FI());
   new ResizeObserver(()=>dm.invalidateSize()).observe(document.getElementById('dmap'))}
  const st=dStops();dMk.clearLayers();
  st.forEach((o,k)=>L.marker(pt(o),{icon:numIcon(k+1)}).bindTooltip('#'+o.num+' '+o.nome).addTo(dMk));
  if(!dPos)L.marker(BASE,{icon:numIcon('L','#0f766e')}).bindTooltip('Loja').addTo(dMk);
  const sig=st.map(o=>o.id).join(',');
  if(sig!==dSig){dSig=sig;dFit=true;fetchRoute()}
 }
 function buildShell(){
  root.innerHTML=`<div class="drv"><h2>Olá, ${esc(D.nome)}</h2>
   <div class="warn" id="dinfo" hidden></div><div id="dmap"></div>
   <div class="row" style="margin:0 0 8px"><button id="dctr">Centralizar em mim</button></div><div id="dlist"></div></div>`;
  dShell=true;
  /* localização em tempo real: a rota é recalculada pelas ruas a partir da posição atual */
  if(navigator.geolocation){

  const g=k=>document.getElementById(k).value.trim(),msg=document.getElementById('fMsg'),btn=document.getElementById('fSave');
  const num=g('fNum'),nome=g('fNome'),end=g('fEnd'),bairro=g('fBairro');
  if(!num||!nome||!end){msg.hidden=false;msg.textContent='Preencha número do pedido, nome e endereço.';return}
  btn.disabled=true;msg.hidden=false;msg.textContent='Salvando e localizando o endereço…';
  let o=id?O(id):null;const isNew=!o;
  const changed=isNew||o.end!==end||(o.bairro||'')!==bairro;
  const data={num,nome,tel:g('fTel'),end,bairro,ref:g('fRef'),itens:g('fItens')};
  let lat=o?o.lat:null,lng=o?o.lng:null,found=true;
  if(changed||lat==null){
   try{const q2=[end,bairro,'Manaus, Amazonas'].filter(Boolean).join(', ');const r=await geocode(q2);if(r){lat=r.lat;lng=r.lng}else{found=false;if(changed){lat=null;lng=null}}}
   catch(e){found=false;if(changed){lat=null;lng=null}}
  }
  if(isNew){o={id:rid('o'),hora:hora(),t:Date.now(),status:'preparo',routeId:null,driver:null,obs:null};S.orders.push(o)}
  Object.assign(o,data,{lat,lng,pend:lat==null});
  closeModal();act=o.id;tab='pedidos';save();render();
  if(lat!=null)flash(o);
  toast(found?'Pedido salvo. Confira o ponto no mapa.':'Pedido salvo, mas o endereço não foi localizado. Use "Marcar no mapa".',!found);
 }

 /* ----- entregadores ----- */
 function openDrivers(){
  const base=location.href.split('#')[0];
  modal(`<h3>Entregadores</h3>${DRIVERS.map(d=>`<div class="rt"><b>${esc(d.nome)}</b>${d.tel?' · '+esc(d.tel):''} ${d.ativo?'':'<span class="bd" style="background:#9ca3af">Desativado</span>'}
   <input readonly value="${esc(base+'#entregador='+d.token)}" style="width:100%;margin-top:4px" onclick="this.select()">
   <div class="row"><button data-dcopy="${esc(d.id)}">Copiar link</button><button data-dtog="${esc(d.id)}">${d.ativo?'Desativar':'Ativar'}</button><button class="d" data-dnew="${esc(d.id)}">Gerar novo link</button></div></div>`).join('')||'<div class="empty">Nenhum entregador cadastrado.</div>'}
   <h4 style="margin:10px 0 4px">Novo entregador</h4>
   <div class="row"><input id="dNome" placeholder="Nome" style="flex:1"><input id="dTel" placeholder="Telefone (opcional)" style="flex:1"><button class="p" id="dAdd">Adicionar</button></div>
   <div class="row"><button id="fCancel">Fechar</button></div>`);
 }
 const newToken=()=>{const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')};
 async function drvOp(fn,okMsg){
  const {error}=await fn();if(error){toast('Não foi possível salvar: '+error.message,true);return}
  await loadAll();render();openDrivers();if(okMsg)toast(okMsg);
 }

 /* ----- eventos ----- */
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lgEmail'||e.target.id==='lgPass'))doLogin()});
 document.addEventListener('click',e=>{
  const t=e.target,g=a=>t.closest('['+a+']'),v=(a)=>g(a)&&g(a).getAttribute(a);
  if(t.id==='lgGo'){doLogin();return}
  if(t.id==='bOut'){sb.auth.signOut().then(()=>{showLogin()});return}
  if(t.id==='fCancel'){closeModal();return}
  if(t.id==='fSave'){saveOrder(t.dataset.id||null);return}
  if(t.id==='bNew'){openOrderForm();return}
  if(t.id==='bDrv'){openDrivers();return}
  if(t.id==='dAdd'){const n=document.getElementById('dNome').value.trim();if(!n)return toast('Digite o nome do entregador.',true);
   drvOp(()=>sb.from('drivers').insert({id:rid('d'),nome:n,tel:document.getElementById('dTel').value.trim()||null}),'Entregador adicionado.');return}
  if(t.dataset.dcopy){const d=DRIVERS.find(x=>x.id===t.dataset.dcopy);const link=location.href.split('#')[0]+'#entregador='+d.token;
   (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Link copiado.')).catch(()=>toast('Não foi possível copiar. Selecione o link e copie manualmente.',true));return}
  if(t.dataset.dtog){const d=DRIVERS.find(x=>x.id===t.dataset.dtog);drvOp(()=>sb.from('drivers').update({ativo:!d.ativo}).eq('id',d.id));return}
  if(t.dataset.dnew){if(!confirm('Gerar um novo link? O link antigo deixa de funcionar e o entregador precisa receber o novo.'))return;
   drvOp(()=>sb.from('drivers').update({token:newToken()}).eq('id',t.dataset.dnew),'Novo link gerado.');return}
  if(t.id==='bLoja'){openLoja();return}
  if(t.id==='lojaFecha'){document.getElementById('lojaBox').hidden=true;return}
  if(t.id==='lojaBusca'){buscaLoja();return}
  if(t.id==='lojaClick'){LOJA.end=document.getElementById('lojaEnd').value.trim();saveLoja();settingLoja=true;lojaMsg('Clique no ponto do mapa onde fica a loja.');render();return}
  if(t.id==='bCanc'){showCanc=true;render();return}
  if(t.id==='bBack'){showCanc=false;render();return}
  if(v('data-t')){tab=v('data-t');render();return}
  if(t.id==='bCl'){sel.clear();render();return}
  if(t.id==='bMk'){const d=document.getElementById('sd').value;if(!d)return alert('Escolha um entregador.');
   const ids=suggest([...sel].filter(id=>O(id)&&free(O(id))));
   nextRouteId().then(nid=>{const r={id:nid,driver:d,ids,status:'rascunho',t:Date.now()};
    ids.forEach(id=>{const o=O(id);o.routeId=r.id;o.driver=d});S.routes.push(r);sel.clear();tab='rotas';showCanc=false;save();render()});return}
  if(t.dataset.c){toggle(t.dataset.c);return}
  const row=t.closest('.o');if(row&&!t.closest('button')&&!t.closest('select')){focus(row.dataset.o);return}
  if(t.dataset.s){const o=O(act);o.status=t.dataset.s;if(o.status==='finalizado'){sel.delete(o.id);act=null}save();render();return}
  if(t.dataset.fix){fixing=t.dataset.fix;render();return}
  if(t.dataset.edit){openOrderForm(t.dataset.edit);return}
  if(t.dataset.del){const o=O(t.dataset.del);if(!o||!confirm('Excluir o pedido #'+o.num+' ('+o.nome+')? Isso não pode ser desfeito.'))return;
   if(o.routeId){const r=R(o.routeId);if(r)r.ids=r.ids.filter(x=>x!==o.id)}
   S.orders=S.orders.filter(x=>x.id!==o.id);sel.delete(o.id);act=null;snap.o.delete(o.id);
   save();queue(async()=>{const {error}=await sb.from('orders').delete().eq('id',o.id);if(error)throw error});render();return}
  if(t.dataset.near){const id=t.dataset.near;sel.add(id);if(act)sel.add(act);render();return}
  const A=(a)=>t.dataset[a];
  if(A('up')||A('dn')){const [rid2,i]=(A('up')||A('dn')).split('|'),r=R(rid2),k=+i,j=A('up')?k-1:k+1;if(j>=0&&j<r.ids.length){[r.ids[k],r.ids[j]]=[r.ids[j],r.ids[k]]}save();render();return}
  if(A('rm')){const [rid2,id]=A('rm').split('|'),r=R(rid2),o=O(id);r.ids=r.ids.filter(x=>x!==id);if(o)detach(o);save();render();return}
  if(A('sg')){const r=R(A('sg'));r.ids=suggest(r.ids);save();render();return}
  if(A('ad')){const r=R(A('ad'));[...sel].filter(id=>O(id)&&free(O(id))).forEach(id=>{const o=O(id);o.routeId=r.id;o.driver=r.driver;if(r.status==='andamento'&&o.status==='preparo')o.status='rota';r.ids.push(id)});sel.clear();save();render();return}
  if(A('cf')){const r=R(A('cf'));r.status='confirmada';save();render();return}
  if(A('ed')){const id=A('ed');editing.has(id)?editing.delete(id):editing.add(id);render();return}
  if(A('cn')){const r=R(A('cn'));if(!confirm('Cancelar a rota '+r.id+'? Os pedidos voltam para a lista de livres.'))return;
   r.status='cancelada';editing.delete(r.id);r.ids.forEach(id=>{const o=O(id);if(o&&o.routeId===r.id)detach(o)});save();render();return}
  if(A('fn')){const r=R(A('fn'));if(!confirm('Finalizar a rota '+r.id+'? Todos os pedidos dela serão marcados como finalizados e saem do mapa.'))return;
   r.ids.forEach(id=>{const o=O(id);if(o)o.status='finalizado'});editing.delete(r.id);save();render();return}
  if(A('vw')){const r=R(A('vw')),p=pendStops(r).map(pt);if(p.length)map.fitBounds(p.concat([BASE]),{padding:[40,40]})}
 });
 document.addEventListener('input',e=>{if(e.target.id==='qs'){q=e.target.value;const p=e.target.selectionStart;renderList();const n=document.getElementById('qs');n.focus();n.setSelectionRange(p,p)}});
 document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='lojaEnd'){LOJA.end=el.value.trim();saveLoja();return}
  if(el.id==='fs'){fil=el.value;renderList();return}
  /* trocar o entregador de uma rota inteira */
  if(el.dataset.drv){const r=R(el.dataset.drv);r.driver=el.value;r.ids.forEach(id=>{const o=O(id);if(o&&o.routeId===r.id)o.driver=r.driver});save();render();return}
  /* mover um pedido para outra rota (outro entregador) */
  if(el.dataset.mv){const [rid2,id]=el.dataset.mv.split('|'),to=R(el.value),from=R(rid2),o=O(id);if(!to||!from||!o)return;
   from.ids=from.ids.filter(x=>x!==id);to.ids.push(id);o.routeId=to.id;o.driver=to.driver;if(to.status==='andamento'&&o.status==='preparo')o.status='rota';save();render();return}
 });
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin()});
 (async()=>{const {data}=await sb.auth.getSession();if(data.session)start();else showLogin()})();
}
</script></body></html>
