<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opção Lanche Delivery Control</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#14202b">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#5b6b79;--line:#d5dce2;--pan:#fff;--ac:#0f766e}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}#root{height:100%}
body{font:14px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:#b91c1c}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
#app{display:grid;grid-template-columns:410px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--ink);color:#fff}
header b{font-size:16px}header span{opacity:.7;font-size:12px}header .sp{flex:1}
header button{background:transparent;color:#fff;border-color:#ffffff55}
aside{background:var(--pan);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:9px;background:none;border-bottom:3px solid transparent}
.tabs button.on{border-bottom-color:var(--ac);font-weight:600}
.pane{overflow:auto;flex:1;padding:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tools input{flex:1;min-width:120px}
.o{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:6px}
.o:hover{border-color:var(--ac)}.o.act{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.o.sel{background:#e6f4f1}.o small{color:var(--mut)}
.bd{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;white-space:nowrap}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:5px 8px;margin:5px 0;font-size:12px}
.pend{background:#fee2e2;border:1px solid #f87171;border-radius:6px;padding:2px 6px;font-size:11px}
.det{border-top:1px solid var(--line);padding:10px;background:#f8fafb;max-height:42%;overflow:auto}
.rt{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.rt h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:6px}
.st{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px dashed var(--line)}
.st i{font-style:normal;background:var(--ink);color:#fff;border-radius:50%;min-width:20px;height:20px;text-align:center;font-size:12px;line-height:20px}
.st div{flex:1}.st button{padding:1px 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#map{height:100%;width:100%;z-index:1}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative}
.leaflet-tile{filter:inherit;visibility:inherit;margin:0!important;padding:0!important;max-width:none!important;max-height:none!important}
.num{background:var(--ink);color:#fff;border-radius:50%;text-align:center;font-weight:700;font-size:12px;line-height:22px;border:2px solid #fff;width:26px!important;height:26px!important}
.bar{position:absolute;z-index:500;left:60px;top:10px;background:#fff;border-radius:8px;padding:6px 10px;box-shadow:0 1px 6px #0003;font-size:12px}
.leg{position:absolute;z-index:500;right:10px;bottom:24px;background:#fff;border-radius:8px;padding:6px 10px;box-shadow:0 1px 6px #0003;font-size:12px}
.leg div{display:flex;gap:6px;align-items:center}.leg s{width:10px;height:10px;border-radius:50%;display:inline-block}
#mapwrap{position:relative;min-height:0;height:100%;width:100%}
.empty{color:var(--mut);padding:14px;text-align:center}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 45vh 1fr}header{grid-column:1}aside{order:3}}
/* entregador */
.drv{max-width:520px;margin:0 auto;padding:12px}.drv .rt{background:#fff}
.drv #dmap{height:48vh;min-height:280px;border-radius:8px;margin:8px 0}
.drv h2{margin:6px 0}
.drv .row button{flex:1;padding:10px}
</style></head><body>
<div id="root"></div>
<script>const KEY='olc_demo_v2';
/* ===== MAPAS: cole aqui a sua chave da Geoapify (https://myprojects.geoapify.com) ===== */
const GEO_KEY='0921bc7aa6764c29bfd04f2f70b0d14c';
const useGeo=!!GEO_KEY; /* sem chave, o app continua funcionando com OpenStreetMap (só para teste) */
const TILE_URL=useGeo?'https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey='+GEO_KEY:'https://'+'tile.'+'openstreetmap.org/{z}/{x}/{y}.png';
const TILE_OPTS={maxZoom:19,attribution:useGeo?'Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> | © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors':'© OpenStreetMap'};
let LOJA={end:'',lat:-3.1019,lng:-60.0250};try{const l=JSON.parse(localStorage.getItem('olc_loja'));if(l&&l.lat!=null)LOJA=l}catch(e){}
let BASE=[LOJA.lat,LOJA.lng];
const saveLoja=()=>{BASE=[LOJA.lat,LOJA.lng];try{localStorage.setItem('olc_loja',JSON.stringify(LOJA))}catch(e){}};
/* busca de endereço: devolve {lat,lng} ou null */
function geocode(a){
 if(useGeo)return fetch('https://api.geoapify.com/v1/geocode/search?format=json&limit=1&lang=pt&filter=countrycode:br&bias=proximity:'+LOJA.lng+','+LOJA.lat+'&text='+encodeURIComponent(a)+'&apiKey='+GEO_KEY)
  .then(r=>r.json()).then(j=>j.results&&j.results.length?{lat:+j.results[0].lat,lng:+j.results[0].lon}:null);
 return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(a))
  .then(r=>r.json()).then(j=>j.length?{lat:+j[0].lat,lng:+j[0].lon}:null);
}
/* Status iguais aos do CompraAgora */
const ST={preparo:['Em preparo','#d97706'],rota:['Em rota de entrega','#0891b2'],finalizado:['Pedido finalizado','#9ca3af']};
const RST={rascunho:'Rascunho',confirmada:'Confirmada',andamento:'Em andamento',finalizada:'Finalizada',cancelada:'Cancelada'};
const ACTIVE=['rascunho','confirmada','andamento'];
const DRIVERS=[{id:'d1',nome:'Carlos (fictício)'},{id:'d2',nome:'Marina (fictícia)'},{id:'d3',nome:'Jorge (fictício)'}];
const PLACES=[
['Rua Joaquim Nabuco, 420','Centro','Perto do Teatro Amazonas',-3.1306,-60.0230],
['Av. Djalma Batista, 1200','Chapada','Em frente ao shopping',-3.0925,-60.0220],
['Rua 10 de Julho, 85','Centro','Ao lado da praça',-3.1295,-60.0215],
['Av. Eduardo Ribeiro, 300','Centro','Edifício comercial',-3.1337,-60.0235],
['Rua Pará, 77','Adrianópolis','Casa azul',-3.1100,-60.0100],
['Av. Ephigênio Salles, 900','Aleixo','Condomínio Vila Real',-3.0850,-59.9800],
['Av. Coronel Teixeira, 5000','Ponta Negra','Perto da orla',-3.0820,-60.1060],
['Rua Rio Jutaí, 150','Vieiralves','Prédio com portaria',-3.1000,-60.0150],
['Av. Torquato Tapajós, 2200','Flores','Posto de gasolina',-3.0780,-60.0140],
['Rua Paraíba, 33','Parque 10','Casa de esquina',-3.0950,-60.0200],
['Av. Max Teixeira, 700','Cidade Nova','Próximo à feira',-3.0300,-59.9700],
['Rua Rio Mar, 60','Japiim','Ao lado da escola',-3.1350,-59.9900]];
const NAMES=['Ana Souza','Bruno Lima','Carla Mendes','Diego Rocha','Elaine Costa','Fábio Alves','Gisele Nunes','Hugo Pereira','Iara Ribeiro','João Batista','Karen Dias','Luís Fonseca'];
const ITEMS=['2 X-Burguer + 1 refri 2L','Combo X-Bacon + batata','3 tapiocas de queijo','1 pizza grande calabresa','2 sucos + 2 sanduíches','1 X-Egg + 1 suco','Marmitex executiva x2'];
const pad=n=>String(n).padStart(2,'0');
const hora=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){
 const o=PLACES.map((p,i)=>({id:'p'+(i+1),num:1001+i,nome:NAMES[i],tel:'(92) 9'+(9100+i*37)+'-'+(1000+i*113),end:p[0]+', '+p[1]+', Manaus - AM',bairro:p[1],ref:p[2],itens:ITEMS[i%ITEMS.length],hora:pad(18+Math.floor(i/6))+':'+pad((i*7)%60),status:'preparo',lat:p[3],lng:p[4],pend:false}));
 o.push({id:'p13',num:1013,nome:'Marcos Tavares',tel:'(92) 99999-0013',end:'Rua sem número, Tarumã, Manaus - AM',bairro:'Tarumã',ref:'Chácara perto da ponte',itens:'1 pizza média',hora:'19:20',status:'preparo',lat:null,lng:null,pend:true});
 return{orders:o,routes:[],seq:1,nextNum:1014};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
/* se não existir ou vier de versão antiga (status diferentes), recria os dados */
if(!S||!S.orders||!S.orders.length||S.orders.some(o=>!ST[o.status])){S=seed();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const save=()=>{S.routes.forEach(syncRoute);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const O=id=>S.orders.find(o=>o.id===id), R=id=>S.routes.find(r=>r.id===id);
/* pedido livre = sem rota e ainda não finalizado */
const free=o=>!o.routeId&&o.status!=='finalizado';
const hav=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const pt=o=>[o.lat,o.lng];
const pendStops=r=>r.ids.map(O).filter(o=>o&&o.lat!=null&&o.status!=='finalizado');
function stats(r){let p=BASE,d=0;const ids=pendStops(r);ids.forEach(o=>{d+=hav(p,pt(o));p=pt(o)});d*=1.3;return{km:d,min:Math.round(d/25*60+3*ids.length)}}
function suggest(ids){let left=ids.map(O).filter(Boolean),p=BASE,out=[];const nl=left.filter(o=>o.lat==null);left=left.filter(o=>o.lat!=null);
 while(left.length){left.sort((a,b)=>hav(p,pt(a))-hav(p,pt(b)));const n=left.shift();out.push(n.id);p=pt(n)}return out.concat(nl.map(o=>o.id))}
function gmaps(o){return 'https://www.google.com/maps/dir/?api=1&destination='+(o.lat!=null?o.lat+','+o.lng:encodeURIComponent(o.end))}
const badge=s=>{const x=ST[s]||['?','#999'];return `<span class="bd" style="background:${x[1]}">${x[0]}</span>`};
/* rota em andamento/confirmada some para "finalizada" quando todos os pedidos dela foram finalizados */
function syncRoute(r){
 if(!['confirmada','andamento'].includes(r.status))return;
 const os=r.ids.map(O).filter(Boolean);
 if(os.length&&os.every(o=>o.status==='finalizado'))r.status='finalizada';
}
const numIcon=(n,col)=>L.divIcon({className:'',html:`<div class="num" ${col?`style="background:${col}"`:''}>${n}</div>`,iconSize:[26,26]});

/* ================= ENTREGADOR ================= */
if(location.hash.startsWith('#entregador=')){
 const did=location.hash.split('=')[1];const D=DRIVERS.find(d=>d.id===did);
 let dm,dLayer,dMk,dMe,dPos=null,dLastPos=null,dLast=0,dSig='',dSeq=0,dFit=true,dTxt='',dGeo='';
 const dRoutes=()=>S.routes.filter(r=>r.driver===did&&['confirmada','andamento'].includes(r.status));
 const dStops=()=>{const out=[];dRoutes().forEach(r=>r.ids.forEach(id=>{const o=O(id);if(o&&o.status!=='finalizado'&&o.lat!=null)out.push(o)}));return out};
 document.getElementById('root').innerHTML=`<div class="drv"><h2>Olá, ${esc(D?D.nome:'entregador')}</h2>
  <div class="warn" id="dinfo" hidden></div><div id="dmap"></div>
  <div class="row" style="margin:0 0 8px"><button id="dctr">Centralizar em mim</button></div><div id="dlist"></div></div>`;
 const setInfo=()=>{const el=document.getElementById('dinfo');const t=(dTxt||'')+(dGeo?(dTxt?'<br>':'')+'<small>'+dGeo+'</small>':'');el.hidden=!t;el.innerHTML=t};
 function drawRoute(ll,legKm,legMin,totKm,totMin,approx){
  dLayer.clearLayers();
  L.polyline(ll,{color:'#fff',weight:10,opacity:.9}).addTo(dLayer);
  const pl=L.polyline(ll,{color:'#2563eb',weight:6,opacity:.95,dashArray:approx?'8 8':null}).addTo(dLayer);
  if(dFit){dFit=false;dm.fitBounds(pl.getBounds().extend(dPos||BASE),{padding:[30,30]})}
  const n=dStops()[0];
  dTxt=n?(`<b>Próxima: #${n.num} ${esc(n.nome)}</b>`+(legKm!=null?` · ${legKm.toFixed(1)} km · ${Math.max(1,Math.round(legMin))} min<br><small>Rota completa: ${totKm.toFixed(1)} km · ~${Math.max(1,Math.round(totMin))} min (trânsito não considerado)</small>`:'')+(approx?'<br><small>Rota aproximada (linha reta): não foi possível consultar o serviço de rotas.</small>':'')):'';
  setInfo();
 }
 function routeCall(pts){
  if(useGeo)return fetch('https://api.geoapify.com/v1/routing?mode=drive&waypoints='+pts.map(p=>p[0]+','+p[1]).join('%7C')+'&apiKey='+GEO_KEY)
   .then(r=>r.json()).then(j=>{const f=j.features&&j.features[0];if(!f)throw new Error('sem rota');
    const g=f.geometry,pr=f.properties,lines=g.type==='MultiLineString'?g.coordinates:[g.coordinates],ll=[];
    lines.forEach(seg=>seg.forEach(c=>ll.push([c[1],c[0]])));
    const lg=pr.legs&&pr.legs[0]?pr.legs[0]:pr;
    return{ll,legKm:lg.distance/1000,legMin:lg.time/60,totKm:pr.distance/1000,totMin:pr.time/60}});
  return fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p[1]+','+p[0]).join(';')+'?overview=full&geometries=geojson')
   .then(r=>r.json()).then(j=>{if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error('sem rota');const rt=j.routes[0];
    return{ll:rt.geometry.coordinates.map(c=>[c[1],c[0]]),legKm:rt.legs[0].distance/1000,legMin:rt.legs[0].duration/60,totKm:rt.distance/1000,totMin:rt.duration/60}});
 }
 function fetchRoute(){
  const stops=dStops();
  if(!stops.length){dLayer.clearLayers();dTxt='';setInfo();return}
  const from=dPos||BASE;dLast=Date.now();dLastPos=from;const my=++dSeq;
  const pts=[from].concat(stops.map(pt));
  routeCall(pts).then(r=>{if(my!==dSeq)return;drawRoute(r.ll,r.legKm,r.legMin,r.totKm,r.totMin,false)})
  .catch(()=>{if(my!==dSeq)return;drawRoute(pts,null,null,0,0,true)});
 }
 function updateMap(){
  if(!dm){dm=L.map('dmap').setView(BASE,12);L.tileLayer(TILE_URL,TILE_OPTS).addTo(dm);
   dLayer=L.layerGroup().addTo(dm);dMk=L.layerGroup().addTo(dm);setTimeout(()=>dm.invalidateSize(),200);
   new ResizeObserver(()=>dm.invalidateSize()).observe(document.getElementById('dmap'))}
  const st=dStops();dMk.clearLayers();
  st.forEach((o,k)=>L.marker(pt(o),{icon:numIcon(k+1)}).bindTooltip('#'+o.num+' '+o.nome).addTo(dMk));
  if(!dPos)L.marker(BASE,{icon:numIcon('L','#0f766e')}).bindTooltip('Loja').addTo(dMk);
  const sig=st.map(o=>o.id).join(',');
  if(sig!==dSig){dSig=sig;dFit=true;fetchRoute()}
 }
 const view=()=>{
  try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
  const rs=dRoutes();
  document.getElementById('dlist').innerHTML=(rs.length?'':'<div class="empty">Nenhuma rota liberada para você agora.</div>')+
  rs.map(r=>`<div class="rt"><h4><span>Rota ${esc(r.id)}</span><span>${RST[r.status]}</span></h4>
   ${r.status==='confirmada'?`<button class="p" style="width:100%" data-a="ini" data-r="${r.id}">Iniciar rota</button>`:''}
   ${r.ids.map((id,i)=>{const o=O(id);if(!o)return '';const done=o.status==='finalizado';return `<div class="st" style="align-items:flex-start;${done?'opacity:.5':''}"><i>${i+1}</i><div><b>${esc(o.nome)}</b> ${badge(o.status)}${o.obs&&!done?' <span class="pend">⚠ '+esc(o.obs)+'</span>':''}<br>
    <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a><br>${esc(o.end)}<br><small>Ref.: ${esc(o.ref)}</small><br><small>${esc(o.itens)}</small>
    ${done?'':`<div class="row"><a href="${gmaps(o)}" target="_blank" rel="noopener"><button>Abrir no Google Maps</button></a>
    ${r.status==='andamento'&&o.status==='rota'?`<button class="p" data-a="ok" data-o="${o.id}">Concluída</button><button class="d" data-a="pb" data-o="${o.id}">Problema</button>`:''}</div>`}</div></div>`}).join('')}</div>`).join('');
  updateMap();
 };
 document.getElementById('root').addEventListener('click',e=>{
  if(e.target.id==='dctr'){if(dPos&&dm)dm.setView(dPos,16);else alert('Localização do aparelho ainda não disponível. Ative o GPS e permita o acesso à localização.');return}
  const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='ini'){const r=R(b.dataset.r);r.status='andamento';r.ids.forEach(id=>{const o=O(id);if(o&&o.status==='preparo')o.status='rota'})}
  if(a==='ok'){O(b.dataset.o).status='finalizado'}
  if(a==='pb'){const m=prompt('Qual foi o problema na entrega?');if(m===null)return;O(b.dataset.o).obs=m}
  save();view();
 });
 window.addEventListener('storage',view);view();
 /* localização em tempo real: a rota é recalculada pelas ruas a partir da posição atual */
 if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
   const first=!dPos;dPos=[p.coords.latitude,p.coords.longitude];dGeo='';
   if(dMe)dMe.setLatLng(dPos);else dMe=L.circleMarker(dPos,{radius:9,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(dm);
   if(first)updateMap();
   if(dStops().length&&(first||(dLastPos&&hav(dPos,dLastPos)*1000>80&&Date.now()-dLast>30000)))fetchRoute();
   setInfo();
  },()=>{dGeo='Ative a localização do aparelho para a rota em tempo real. Por enquanto a rota parte da loja.';setInfo()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
 }else{dGeo='Este aparelho não oferece localização. A rota parte da loja.';setInfo()}
}
/* ================= ADMIN ================= */
else{
 let tab='pedidos',q='',fil='',act=null,fixing=null,map,mk,rl,lojaMk,settingLoja=false,showCanc=false;
 const sel=new Set(),editing=new Set();
 document.getElementById('root').innerHTML=`<div id="app"><header><b>Opção Lanche · Delivery Control</b><span>Modo demonstração · Manaus · dados fictícios${useGeo?'':' · ⚠ chave Geoapify não configurada (mapa de teste)'}</span><div class="sp"></div>
 <button id="bLoja">Endereço da loja</button><button id="bNew">+ Pedido fictício</button><button id="bRst">Reiniciar demonstração</button></header>
 <aside><div class="tabs"><button data-t="pedidos">Pedidos</button><button data-t="rotas">Rotas</button></div><div class="pane" id="pane"></div><div class="det" id="det" hidden></div></aside>
 <div id="mapwrap"><div id="map"></div><div class="bar" id="bar"></div><div class="leg" id="leg"></div>
 <div class="leg" id="lojaBox" hidden style="left:60px;right:auto;top:50px;bottom:auto;width:340px;font-size:13px"><b>Endereço da loja</b>
 <input id="lojaEnd" placeholder="Rua, número, bairro, Manaus" style="width:100%;margin:6px 0">
 <div class="row" style="margin:0"><button class="p" id="lojaBusca">Buscar no mapa</button><button id="lojaClick">Marcar no mapa</button><button id="lojaFecha">Fechar</button></div>
 <div id="lojaMsg" style="margin-top:6px;color:#5b6b79">Você também pode arrastar o pin da loja no mapa.</div></div></div></div>`;
 map=L.map('map').setView([-3.09,-60.03],12);
 L.tileLayer(TILE_URL,TILE_OPTS).addTo(map);
 mk=L.layerGroup().addTo(map);rl=L.layerGroup().addTo(map);
 lojaMk=L.marker(BASE,{draggable:true,icon:L.divIcon({className:'',html:'<div class="num" style="background:#0f766e">L</div>',iconSize:[26,26]})}).addTo(map).bindTooltip('Loja (arraste para ajustar)');
 lojaMk.on('dragend',()=>{const q2=lojaMk.getLatLng();LOJA.lat=q2.lat;LOJA.lng=q2.lng;saveLoja();render()});
 document.getElementById('leg').innerHTML=Object.keys(ST).filter(k=>k!=='finalizado').map(k=>`<div><s style="background:${ST[k][1]}"></s>${ST[k][0]}</div>`).join('')+'<div style="color:#5b6b79;margin-top:3px">Finalizados saem do mapa</div>';
 /* corrige o mapa cortado: recalcula o tamanho sempre que a área do mapa muda */
 new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('mapwrap'));
 map.on('click',e=>{if(settingLoja){LOJA.lat=e.latlng.lat;LOJA.lng=e.latlng.lng;settingLoja=false;saveLoja();lojaMk.setLatLng(e.latlng);render();return}if(!fixing)return;const o=O(fixing);o.lat=e.latlng.lat;o.lng=e.latlng.lng;o.pend=false;fixing=null;save();render();flash(o)});
 const lojaMsg=m=>{document.getElementById('lojaMsg').textContent=m};
 function openLoja(){document.getElementById('lojaBox').hidden=false;document.getElementById('lojaEnd').value=LOJA.end||''}
 function buscaLoja(){const a=document.getElementById('lojaEnd').value.trim();LOJA.end=a;saveLoja();if(!a)return lojaMsg('Digite o endereço.');lojaMsg('Buscando...');
  geocode(a).then(r=>{
   if(!r)return lojaMsg('Endereço não encontrado. Tente sem o número ou use "Marcar no mapa".');
   LOJA.lat=r.lat;LOJA.lng=r.lng;saveLoja();lojaMk.setLatLng(BASE);map.flyTo(BASE,16);render();lojaMsg('Localização encontrada. Confira o pin e arraste se precisar ajustar.')})
  .catch(()=>lojaMsg('A busca falhou. Use "Marcar no mapa" ou arraste o pin.'))}
 function flash(o){if(o.lat!=null)map.flyTo(pt(o),15)}
 function focus(id){act=id;const o=O(id);if(o.lat!=null&&o.status!=='finalizado')map.flyTo(pt(o),15);render()}
 function toggle(id){const o=O(id);if(!free(o))return focus(id);sel.has(id)?sel.delete(id):sel.add(id);act=id;render()}
 function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  mk.clearLayers();rl.clearLayers();
  /* pedido finalizado não aparece no mapa */
  const onMap=S.orders.filter(o=>o.lat!=null&&o.status!=='finalizado');
  onMap.forEach(o=>{const c=ST[o.status][1],s=sel.has(o.id);
   L.circleMarker(pt(o),{radius:s?12:9,fillColor:c,fillOpacity:1,color:s?'#000':'#fff',weight:s?4:2}).addTo(mk)
   .bindTooltip('#'+o.num+' '+o.nome+' · '+ST[o.status][0]).on('click',()=>toggle(o.id))});
  S.routes.filter(r=>ACTIVE.includes(r.status)).forEach((r,k)=>{
   const col=['#0f766e','#b45309','#6d28d9','#be123c'][k%4];const pts=[BASE];
   pendStops(r).forEach((o,i)=>{pts.push(pt(o));
    L.marker(pt(o),{icon:numIcon(i+1,col),interactive:false}).addTo(rl)});
   if(pts.length>1)L.polyline(pts,{color:col,weight:4,opacity:.8,dashArray:r.status==='rascunho'?'8 6':null}).addTo(rl)});
  document.getElementById('bar').innerHTML=settingLoja?'Clique no mapa para marcar a loja':fixing?'Clique no mapa para marcar a localização do pedido #'+O(fixing).num+' <button id="bCx">Cancelar</button>':`${onMap.length} pedido(s) no mapa · ${sel.size} selecionado(s)`;
  const cx=document.getElementById('bCx');if(cx)cx.onclick=()=>{fixing=null;render()};
  tab==='pedidos'?renderList():renderRoutes();renderDet();
  map.invalidateSize();
 }
 function renderList(){
  const ql=q.toLowerCase();
  const L2=S.orders.filter(o=>(fil==='todos'||(fil===''?o.status!=='finalizado':o.status===fil))&&(!ql||[o.nome,o.num,o.end,o.bairro].join(' ').toLowerCase().includes(ql)));
  const selFree=[...sel].filter(id=>free(O(id)));
  document.getElementById('pane').innerHTML=`<div class="tools"><input id="qs" placeholder="Buscar nome, nº, endereço, bairro" value="${esc(q)}">
   <select id="fs"><option value="">Ativos (preparo + em rota)</option>${Object.keys(ST).map(k=>`<option value="${k}" ${fil===k?'selected':''}>${ST[k][0]}</option>`).join('')}<option value="todos" ${fil==='todos'?'selected':''}>Todos</option></select></div>
   <div class="rt" style="background:#f8fafb"><b>Montar rota</b> (${selFree.length} pedido(s))
   <div class="row"><select id="sd"><option value="">Escolher entregador (fictício)</option>${DRIVERS.map(d=>`<option value="${d.id}">${esc(d.nome)}</option>`).join('')}</select>
   <button class="p" id="bMk" ${selFree.length?'':'disabled'}>Criar rota</button><button id="bCl" ${sel.size?'':'disabled'}>Limpar seleção</button></div></div>
   ${L2.length?L2.map(o=>`<div class="o ${sel.has(o.id)?'sel':''} ${act===o.id?'act':''}" data-o="${o.id}">
    <input type="checkbox" ${sel.has(o.id)?'checked':''} ${free(o)?'':'disabled'} data-c="${o.id}">
    <div><b>#${o.num} ${esc(o.nome)}</b> ${badge(o.status)} ${o.pend?'<span class="pend">localização pendente</span>':''}${o.obs&&o.status!=='finalizado'?' <span class="pend">⚠ problema</span>':''}<br>
    <small>${esc(o.bairro)} · ${esc(o.hora)}${o.routeId?' · Rota '+esc(o.routeId):''}${o.driver?' · '+esc(DRIVERS.find(d=>d.id===o.driver)?.nome||''):''}</small><br><small>${esc(o.itens)}</small></div></div>`).join(''):'<div class="empty">Nenhum pedido encontrado.</div>'}`;
 }
 function renderDet(){
  const el=document.getElementById('det'),o=act&&O(act);if(!o||tab!=='pedidos'){el.hidden=true;return}el.hidden=false;
  const near=S.orders.filter(x=>x.id!==o.id&&x.lat!=null&&o.lat!=null&&free(x)&&hav(pt(o),pt(x))<=2).sort((a,b)=>hav(pt(o),pt(a))-hav(pt(o),pt(b)));
  el.innerHTML=`<b>#${o.num} ${esc(o.nome)}</b> ${badge(o.status)}<br>Tel.: ${esc(o.tel)}<br>${esc(o.end)}<br>Bairro: ${esc(o.bairro)} · Ref.: ${esc(o.ref)}<br>Itens: ${esc(o.itens)}<br>Recebido às ${esc(o.hora)}${o.obs?'<br>Problema: '+esc(o.obs):''}
  ${o.pend?'<div class="pend" style="margin-top:6px">Endereço sem localização no mapa.</div>':''}
  <div class="row">${Object.keys(ST).map(s=>`<button data-s="${s}" ${o.status===s?'disabled':''}>${ST[s][0]}</button>`).join('')}
  <button data-fix="${o.id}">${o.lat==null?'Marcar no mapa':'Corrigir localização'}</button></div>
  ${near.length?`<div style="margin-top:6px"><small>Sugestão: ${near.length} pedido(s) livre(s) a até 2 km, que podem ir juntos:</small><br>${near.slice(0,4).map(x=>`<button data-near="${x.id}" style="margin:2px 2px 0 0">#${x.num} ${esc(x.bairro)} (${hav(pt(o),pt(x)).toFixed(1)} km)</button>`).join('')}</div>`:''}`;
 }
 function routeCard(r){
  const dr=DRIVERS.find(d=>d.id===r.driver),s=stats(r),dra=r.status==='rascunho',ed=dra||editing.has(r.id);
  const link=location.href.split('#')[0]+'#entregador='+r.driver;
  const addable=[...sel].filter(id=>free(O(id)));
  const others=S.routes.filter(x=>x.id!==r.id&&ACTIVE.includes(x.status));
  return `<div class="rt"><h4><span>Rota ${r.id} · ${esc(dr?.nome)}</span><span class="bd" style="background:#475569">${RST[r.status]}</span></h4>
   ${ed?`<div class="row" style="margin:4px 0"><small>Entregador:</small><select data-drv="${r.id}">${DRIVERS.map(d=>`<option value="${d.id}" ${d.id===r.driver?'selected':''}>${esc(d.nome)}</option>`).join('')}</select></div>`:''}
   <small>${pendStops(r).length} entrega(s) pendente(s) · ~${s.km.toFixed(1)} km · ~${s.min} min (estimativa em linha reta, sem trânsito)</small>
   ${r.ids.map((id,i)=>{const o=O(id);if(!o)return '';const done=o.status==='finalizado';return `<div class="st" style="${done?'opacity:.55':''}"><i>${i+1}</i><div><b>#${o.num} ${esc(o.nome)}</b> ${badge(o.status)}<br><small>${esc(o.end)}</small>
    ${ed&&!done&&others.length?`<br><select data-mv="${r.id}|${id}"><option value="">Mover para outra rota…</option>${others.map(x=>`<option value="${x.id}">Rota ${x.id} · ${esc(DRIVERS.find(d=>d.id===x.driver)?.nome||'')}</option>`).join('')}</select>`:''}</div>
    ${ed?`<button data-up="${r.id}|${i}">↑</button><button data-dn="${r.id}|${i}">↓</button><button class="d" data-rm="${r.id}|${id}">✕</button>`:''}</div>`}).join('')}
   <div class="row">${ed?`<button data-sg="${r.id}">Sugerir sequência</button><button data-ad="${r.id}" ${addable.length?'':'disabled'}>Adicionar selecionados (${addable.length})</button>`:''}
   ${dra?`<button class="p" data-cf="${r.id}" ${r.ids.length?'':'disabled'}>Confirmar rota</button>`:''}
   ${!dra&&ACTIVE.includes(r.status)?`<button data-ed="${r.id}" ${ed?'class="p"':''}>${ed?'Concluir edição':'Editar rota'}</button>`:''}
   ${ACTIVE.includes(r.status)?`<button class="d" data-cn="${r.id}">Cancelar</button>`:''}
   ${['confirmada','andamento'].includes(r.status)?`<button class="p" data-fn="${r.id}">Finalizar</button>`:''}
   <button data-vw="${r.id}">Ver no mapa</button></div>
   ${ed&&!dra?'<div class="warn">Modo edição: as mudanças valem na hora, inclusive no app do entregador.</div>':''}
   ${['confirmada','andamento'].includes(r.status)?`<div style="margin-top:6px"><small>Link do entregador (abra em outra aba para testar):</small><br><input readonly style="width:100%" value="${esc(link)}" onclick="this.select()"></div>`:''}</div>`;
 }
 function cancelledCard(r){
  const dr=DRIVERS.find(d=>d.id===r.driver);
  return `<div class="rt" style="background:#f8fafb"><h4><span>Rota ${r.id} · ${esc(dr?.nome)}</span><span class="bd" style="background:#b91c1c">Cancelada</span></h4>
   ${r.ids.map((id,i)=>{const o=O(id);return o?`<div class="st"><i>${i+1}</i><div><b>#${o.num} ${esc(o.nome)}</b><br><small>${esc(o.end)}</small></div></div>`:''}).join('')||'<small>Sem pedidos.</small>'}</div>`;
 }
 function renderRoutes(){
  const canc=S.routes.filter(r=>r.status==='cancelada').slice().reverse();
  const rs=S.routes.filter(r=>r.status!=='cancelada').slice().reverse();
  document.getElementById('pane').innerHTML=showCanc
   ?`<div class="tools"><button id="bBack">← Voltar às rotas</button></div>`+(canc.length?canc.map(cancelledCard).join(''):'<div class="empty">Nenhuma rota cancelada.</div>')
   :`<div class="tools"><button id="bCanc">Rotas canceladas (${canc.length})</button></div>`+(rs.length?rs.map(routeCard).join(''):'<div class="empty">Nenhuma rota ainda. Selecione pedidos na aba Pedidos e crie uma rota.</div>');
 }
 /* tira o pedido de uma rota (sem mexer no status dele) */
 function detach(o){o.routeId=null;o.driver=null}
 document.addEventListener('click',e=>{
  const t=e.target,g=a=>t.closest('['+a+']'),v=(a)=>g(a)&&g(a).getAttribute(a);
  if(t.id==='bLoja'){openLoja();return}
  if(t.id==='lojaFecha'){document.getElementById('lojaBox').hidden=true;return}
  if(t.id==='lojaBusca'){buscaLoja();return}
  if(t.id==='lojaClick'){LOJA.end=document.getElementById('lojaEnd').value.trim();saveLoja();settingLoja=true;lojaMsg('Clique no ponto do mapa onde fica a loja.');render();return}
  if(t.id==='bNew'){const p=PLACES[Math.floor(Math.random()*PLACES.length)],n=S.nextNum++;
   S.orders.push({id:'p'+Date.now(),num:n,nome:NAMES[Math.floor(Math.random()*NAMES.length)],tel:'(92) 99'+Math.floor(1000+Math.random()*8999)+'-'+Math.floor(1000+Math.random()*8999),end:p[0]+', '+p[1]+', Manaus - AM',bairro:p[1],ref:p[2],itens:ITEMS[Math.floor(Math.random()*ITEMS.length)],hora:hora(),status:'preparo',lat:p[3]+(Math.random()-.5)*.006,lng:p[4]+(Math.random()-.5)*.006,pend:false});save();render();return}
  if(t.id==='bRst'){if(confirm('Apagar tudo e recriar os dados fictícios?')){S=seed();sel.clear();editing.clear();act=null;save();render()}return}
  if(t.id==='bCanc'){showCanc=true;render();return}
  if(t.id==='bBack'){showCanc=false;render();return}
  if(v('data-t')){tab=v('data-t');render();return}
  if(t.id==='bCl'){sel.clear();render();return}
  if(t.id==='bMk'){const d=document.getElementById('sd').value;if(!d)return alert('Escolha um entregador.');
   const ids=suggest([...sel].filter(id=>free(O(id))));const r={id:'R'+S.seq++,driver:d,ids,status:'rascunho'};
   ids.forEach(id=>{const o=O(id);o.routeId=r.id;o.driver=d});S.routes.push(r);sel.clear();tab='rotas';showCanc=false;save();render();return}
  if(t.dataset.c){toggle(t.dataset.c);return}
  const row=t.closest('.o');if(row&&!t.closest('button')&&!t.closest('select')){focus(row.dataset.o);return}
  if(t.dataset.s){const o=O(act);o.status=t.dataset.s;if(o.status==='finalizado'){sel.delete(o.id);act=null}save();render();return}
  if(t.dataset.fix){fixing=t.dataset.fix;render();return}
  if(t.dataset.near){const id=t.dataset.near;sel.add(id);if(act)sel.add(act);render();return}
  const A=(a)=>t.dataset[a];
  if(A('up')||A('dn')){const [rid,i]=(A('up')||A('dn')).split('|'),r=R(rid),k=+i,j=A('up')?k-1:k+1;if(j>=0&&j<r.ids.length){[r.ids[k],r.ids[j]]=[r.ids[j],r.ids[k]]}save();render();return}
  if(A('rm')){const [rid,id]=A('rm').split('|'),r=R(rid),o=O(id);r.ids=r.ids.filter(x=>x!==id);detach(o);save();render();return}
  if(A('sg')){const r=R(A('sg'));r.ids=suggest(r.ids);save();render();return}
  if(A('ad')){const r=R(A('ad'));[...sel].filter(id=>free(O(id))).forEach(id=>{const o=O(id);o.routeId=r.id;o.driver=r.driver;if(r.status==='andamento'&&o.status==='preparo')o.status='rota';r.ids.push(id)});sel.clear();save();render();return}
  if(A('cf')){const r=R(A('cf'));r.status='confirmada';save();render();return}
  if(A('ed')){const id=A('ed');editing.has(id)?editing.delete(id):editing.add(id);render();return}
  if(A('cn')){const r=R(A('cn'));if(!confirm('Cancelar a rota '+r.id+'? Os pedidos voltam para a lista de livres.'))return;
   r.status='cancelada';editing.delete(r.id);r.ids.forEach(id=>{const o=O(id);if(o&&o.routeId===r.id)detach(o)});save();render();return}
  if(A('fn')){const r=R(A('fn'));if(!confirm('Finalizar a rota '+r.id+'? Todos os pedidos dela serão marcados como finalizados e saem do mapa.'))return;
   r.ids.forEach(id=>{const o=O(id);if(o)o.status='finalizado'});editing.delete(r.id);save();render();return}
  if(A('vw')){const r=R(A('vw')),p=pendStops(r).map(pt);if(p.length)map.fitBounds(p.concat([BASE]),{padding:[40,40]})}
 });
 document.addEventListener('input',e=>{if(e.target.id==='qs'){q=e.target.value;const p=e.target.selectionStart;renderList();const n=document.getElementById('qs');n.focus();n.setSelectionRange(p,p)}});
 document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='lojaEnd'){LOJA.end=el.value.trim();saveLoja();return}
  if(el.id==='fs'){fil=el.value;renderList();return}
  /* trocar o entregador de uma rota inteira */
  if(el.dataset.drv){const r=R(el.dataset.drv);r.driver=el.value;r.ids.forEach(id=>{const o=O(id);if(o&&o.routeId===r.id)o.driver=r.driver});save();render();return}
  /* mover um pedido para outra rota (outro entregador) */
  if(el.dataset.mv){const [rid,id]=el.dataset.mv.split('|'),to=R(el.value),from=R(rid),o=O(id);if(!to||!from||!o)return;
   from.ids=from.ids.filter(x=>x!==id);to.ids.push(id);o.routeId=to.id;o.driver=to.driver;if(to.status==='andamento'&&o.status==='preparo')o.status='rota';save();render();return}
 });
 window.addEventListener('storage',()=>{try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}render()});
 render();
 setTimeout(()=>map.invalidateSize(),200);
}
</script></body></html>
