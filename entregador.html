<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F0E">
<title>Entregador · Opção Lanche</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('opcao_tema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0D0F0E;--card:#171D1A;--line:#252E29;--ink:#F1F5F2;--mut:#929D96;--g:#00C875;--gh:#12d884;--bad:#E5484D;--warn:#F5C542;--warnbg:rgba(245,197,66,.1);color-scheme:dark}
[data-theme=light]{--bg:#F3F6F4;--card:#fff;--line:#DDE5E0;--ink:#14201A;--mut:#5F6B64;--g:#00A862;--gh:#00b86c;--bad:#D6343A;--warn:#8a5a00;--warnbg:#fff4d6;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.tb{position:sticky;top:0;z-index:1100;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tb b{color:var(--g)}.tb span:first-child{font-weight:700}.tb .ac{display:flex;gap:8px}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;transition:transform .1s,border-color .15s}
button:active{transform:scale(.97)}button:hover{border-color:var(--g)}
button.p{background:var(--g);border-color:var(--g);color:#04130B}button.d{color:var(--bad)}button.big{width:100%;padding:13px}
.ib{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center}.tema .lua{display:none}[data-theme=light] .tema .sol{display:none}[data-theme=light] .tema .lua{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}input:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,200,117,.15)}
label{display:block;font-size:.78rem;color:var(--mut);margin:12px 0 4px}
.drv{max-width:560px;margin:0 auto;padding:14px}.drv h2{margin:4px 0 10px;font-size:1.25rem}
.lg{margin-top:8vh;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.lg h1{margin:0 0 4px;font-size:1.3rem}.lg h1 b{color:var(--g)}.lg p{color:var(--mut);margin:0 0 6px}.lg .big{margin-top:16px}.lg .err{color:var(--bad);min-height:1.2em;margin-top:10px}
.warn{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:.88rem}.warn small{opacity:.9}
.pend{color:var(--warn);font-weight:600}
#dmap{height:42vh;min-height:250px;border-radius:16px;margin:8px 0;border:1px solid var(--line)}
#dmap.dfull{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100vh;min-height:0;margin:0;border-radius:0;z-index:1200}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}.row a{display:contents}.row button{width:100%;padding:11px}
.rt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.rt h4{margin:0 0 10px;display:flex;justify-content:space-between;font-size:1rem}.rt h4 span:last-child{color:var(--g);font-size:.82rem}
.st{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.st:first-of-type{border-top:0}
.st>i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#04130B;display:grid;place-items:center;font:700 .85rem sans-serif;font-style:normal}
.st a{color:var(--g)}.st small{color:var(--mut)}
.bd{color:#fff;border-radius:99px;padding:2px 9px;font-size:.7rem;font-weight:700;vertical-align:middle}
.empty{color:var(--mut);text-align:center;padding:30px 8px}
.num{width:26px;height:26px;border-radius:50%;background:#0f3d2c;color:#fff;border:2px solid #fff;display:grid;place-items:center;font:700 12px sans-serif;box-shadow:0 1px 4px #0006}
.dfs{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:600}
.dfi{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 11px;border-radius:12px;max-width:72vw;font-size:12px;box-shadow:0 4px 14px #0004}.dfi:empty{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:3000;display:none;max-width:90vw;font-size:14px}
</style></head><body>
<header class="tb"><span>Opção <b>Lanche</b> · Entregador</span><span class="ac">
<button class="ib tema" id="tema" aria-label="Alternar modo claro e escuro" title="Modo claro/escuro"><svg class="ic sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg><svg class="ic lua" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
<button id="sair" hidden>Sair</button></span></header>
<div id="root"></div><div id="toast"></div>
<script>/* ===== CONFIGURAÇÃO (chaves públicas: a proteção dos dados é feita pelo login e pelas regras do Supabase) ===== */
const SB_URL='https://mijiqvekuwhvehzfygkt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pamlxdmVrdXdodmVoemZ5Z2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzY1ODYsImV4cCI6MjExMDk1MjU4Nn0.pXt5zzdC5M08yRgtPsU6Q_ZhBkfjZ3q6f5-6v_fYlUw';
const GEO_KEY='0921bc7aa6764c29bfd04f2f70b0d14c'; /* Geoapify */
const useGeo=!!GEO_KEY;
const tileUrl=()=>useGeo?'https://maps.geoapify.com/v1/tile/'+(document.documentElement.dataset.theme==='light'?'osm-bright':'dark-matter')+'/{z}/{x}/{y}.png?apiKey='+GEO_KEY:'https://'+'tile.'+'openstreetmap.org/{z}/{x}/{y}.png';
const TILE_OPTS={maxZoom:19,attribution:useGeo?'Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> | © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors':'© OpenStreetMap'};
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:false}});

/* Status iguais aos do CompraAgora */
const ST={preparo:['Em preparo','#d97706'],rota:['Em rota de entrega','#0891b2'],finalizado:['Pedido finalizado','#9ca3af']};
const RST={rascunho:'Rascunho',confirmada:'Confirmada',andamento:'Em andamento',finalizada:'Finalizada',cancelada:'Cancelada'};
const ACTIVE=['rascunho','confirmada','andamento'];
let LOJA={end:'',lat:-3.1019,lng:-60.0250};
let BASE=[LOJA.lat,LOJA.lng];
let S={orders:[],routes:[]};
let DRIVERS=[];
const pad=n=>String(n).padStart(2,'0');
const fmtHora=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const hora=()=>fmtHora(Date.now());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- conversão banco <-> app ---------- */
const orderFromDb=r=>({id:r.id,num:r.num,nome:r.nome,tel:r.tel,end:r.endereco,bairro:r.bairro,ref:r.ref,itens:r.itens,hora:fmtHora(r.created_at),t:Date.parse(r.created_at),status:r.status,lat:r.lat,lng:r.lng,pend:r.lat==null,routeId:r.route_id,driver:r.driver_id,obs:r.obs});
const orderToDb=o=>({id:o.id,num:o.num,nome:o.nome,tel:o.tel??null,endereco:o.end??null,bairro:o.bairro??null,ref:o.ref??null,itens:o.itens??null,status:o.status,lat:o.lat??null,lng:o.lng??null,obs:o.obs||null,route_id:o.routeId||null,driver_id:o.driver||null});
const routeFromDb=r=>({id:r.id,driver:r.driver_id,ids:r.ids||[],status:r.status,t:Date.parse(r.created_at)});
const routeToDb=r=>({id:r.id,driver_id:r.driver||null,ids:r.ids,status:r.status});
const driverFromDb=d=>({id:d.id,nome:d.nome,tel:d.tel,token:d.token,ativo:d.ativo});

const O=id=>S.orders.find(o=>o.id===id), R=id=>S.routes.find(r=>r.id===id);
/* pedido livre = sem rota e ainda não finalizado */
const free=o=>!o.routeId&&o.status!=='finalizado';
const hav=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const pt=o=>[o.lat,o.lng];
const fullEnd=o=>(o.end||'')+(o.bairro&&!String(o.end||'').toLowerCase().includes(String(o.bairro).toLowerCase())?' - '+o.bairro:'');
const pendStops=r=>r.ids.map(O).filter(o=>o&&o.lat!=null&&o.status!=='finalizado');
function stats(r){let p=BASE,d=0;const ids=pendStops(r);ids.forEach(o=>{d+=hav(p,pt(o));p=pt(o)});d*=1.3;return{km:d,min:Math.round(d/25*60+3*ids.length)}}
function suggest(ids){let left=ids.map(O).filter(Boolean),p=BASE,out=[];const nl=left.filter(o=>o.lat==null);left=left.filter(o=>o.lat!=null);
 while(left.length){left.sort((a,b)=>hav(p,pt(a))-hav(p,pt(b)));const n=left.shift();out.push(n.id);p=pt(n)}return out.concat(nl.map(o=>o.id))}
function gmaps(o){return 'https://www.google.com/maps/dir/?api=1&destination='+(o.lat!=null?o.lat+','+o.lng:encodeURIComponent(fullEnd(o)+', Manaus - AM'))}
const badge=s=>{const x=ST[s]||['?','#999'];return `<span class="bd" style="background:${x[1]}">${x[0]}</span>`};
/* rota some para "finalizada" quando todos os pedidos dela foram finalizados */
function syncRoute(r){
 if(!['confirmada','andamento'].includes(r.status))return;
 const os=r.ids.map(O).filter(Boolean);
 if(os.length&&os.every(o=>o.status==='finalizado'))r.status='finalizada';
}
const numIcon=(n,col)=>L.divIcon({className:'',html:`<div class="num" ${col?`style="background:${col}"`:''}>${n}</div>`,iconSize:[26,26]});
function toast(m,err){const el=document.getElementById('toast');el.textContent=m;el.style.background=err?'#b91c1c':'#14202b';el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{el.style.display='none'},err?6000:2500)}
/* busca de endereço: devolve {lat,lng} ou null */
function geocode(a){
 if(useGeo)return fetch('https://api.geoapify.com/v1/geocode/search?format=json&limit=1&lang=pt&filter=countrycode:br&bias=proximity:'+LOJA.lng+','+LOJA.lat+'&text='+encodeURIComponent(a)+'&apiKey='+GEO_KEY)
  .then(r=>r.json()).then(j=>j.results&&j.results.length?{lat:+j.results[0].lat,lng:+j.results[0].lon}:null);
 return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(a))
  .then(r=>r.json()).then(j=>j.length?{lat:+j[0].lat,lng:+j[0].lon}:null);
}

/* ---------- gravação no banco (fila, só envia o que mudou) ---------- */
const snap={o:new Map(),r:new Map()};
const snapAll=()=>{snap.o.clear();snap.r.clear();S.orders.forEach(x=>snap.o.set(x.id,JSON.stringify(orderToDb(x))));S.routes.forEach(x=>snap.r.set(x.id,JSON.stringify(routeToDb(x))))};
let busy=0,needReload=false,pushChain=Promise.resolve(),reloadFn=()=>{};
function queue(fn){
 busy++;
 pushChain=pushChain.then(fn).catch(e=>{toast('Não foi possível salvar: '+(e&&e.message||e),true);needReload=true})
  .finally(()=>{busy--;if(!busy&&needReload){needReload=false;reloadFn()}});
}
async function push(){
 const rr=S.routes.map(routeToDb).filter(x=>snap.r.get(x.id)!==JSON.stringify(x));
 const oo=S.orders.map(orderToDb).filter(x=>snap.o.get(x.id)!==JSON.stringify(x));
 if(rr.length){const {error}=await sb.from('routes').upsert(rr);if(error)throw error;rr.forEach(x=>snap.r.set(x.id,JSON.stringify(x)))}
 if(oo.length){const {error}=await sb.from('orders').upsert(oo);if(error)throw error;oo.forEach(x=>snap.o.set(x.id,JSON.stringify(x)))}
}
const save=()=>{S.routes.forEach(syncRoute);queue(push)};
function saveLoja(){BASE=[LOJA.lat,LOJA.lng];queue(async()=>{const {error}=await sb.from('loja').upsert({id:1,endereco:LOJA.end||null,lat:LOJA.lat,lng:LOJA.lng});if(error)throw error})}


document.getElementById('tema').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('opcao_tema',t)}catch(e){}document.querySelector('meta[name=theme-color]').content=t==='light'?'#F3F6F4':'#0D0F0E';if(window.__dTile)window.__dTile.setUrl(tileUrl())};
document.getElementById('sair').onclick=async()=>{await sb.auth.signOut();location.reload()};
(function(){
 let dTile,D=null,did=null,dm,dLayer,dMk,dMe,dPos=null,dLastPos=null,dLast=0,dSig='',dSeq=0,dFit=true,dTxt='',dGeo='',dTail=null,dHash='',dShell=false;
 const root=document.getElementById('root');
 root.innerHTML='<div class="drv"><h2>Carregando…</h2></div>';
 const dRoutes=()=>S.routes.filter(r=>r.driver===did&&['confirmada','andamento'].includes(r.status));
 const dStops=()=>{const out=[];dRoutes().forEach(r=>r.ids.forEach(id=>{const o=O(id);if(o&&o.status!=='finalizado'&&o.lat!=null)out.push(o)}));return out};
 const setInfo=()=>{const el=document.getElementById('dinfo');if(!el)return;const t=(dTxt||'')+(dGeo?(dTxt?'<br>':'')+'<small>'+dGeo+'</small>':'');el.hidden=!t;el.innerHTML=t;document.querySelectorAll('.dfi').forEach(e=>{e.innerHTML=t})};
 function drawRoute(ll,legKm,legMin,totKm,totMin,approx){
  dLayer.clearLayers();
  L.polyline(ll,{color:'#fff',weight:10,opacity:.9}).addTo(dLayer);
  const pl=L.polyline(ll,{color:'#2563eb',weight:6,opacity:.95,dashArray:approx?'8 8':null}).addTo(dLayer);
  if(dFit){dFit=false;dm.fitBounds(pl.getBounds().extend(dPos||BASE),{padding:[30,30]})}
  const n=dStops()[0];
  dTxt=n?(`<b>Próxima: #${esc(n.num)} ${esc(n.nome)}</b>`+(legKm!=null?` · ${legKm.toFixed(1)} km · ${Math.max(1,Math.round(legMin))} min<br><small>Rota completa: ${totKm.toFixed(1)} km · ~${Math.max(1,Math.round(totMin))} min (trânsito não considerado)</small>`:'')+(approx?'<br><small>Rota aproximada (linha reta): não foi possível consultar o serviço de rotas.</small>':'')):'';
  setInfo();
 }
 function routeCall(pts){
  if(useGeo)return fetch('https://api.geoapify.com/v1/routing?mode=drive&waypoints='+pts.map(p=>p[0]+','+p[1]).join('%7C')+'&apiKey='+GEO_KEY)
   .then(r=>r.json()).then(j=>{const f=j.features&&j.features[0];if(!f)throw new Error('sem rota');
    const g=f.geometry,pr=f.properties,lines=g.type==='MultiLineString'?g.coordinates:[g.coordinates],ll=[];
    lines.forEach(seg=>seg.forEach(c=>ll.push([c[1],c[0]])));
    const lg=pr.legs&&pr.legs[0]?pr.legs[0]:pr;
    const legs=(pr.legs&&pr.legs.length===lines.length&&lines.length===pts.length-1)?lines.map((seg,i)=>({ll:seg.map(c=>[c[1],c[0]]),km:pr.legs[i].distance/1000,min:pr.legs[i].time/60})):null;
    return{ll,legs,legKm:lg.distance/1000,legMin:lg.time/60,totKm:pr.distance/1000,totMin:pr.time/60}});
  return fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p[1]+','+p[0]).join(';')+'?overview=full&geometries=geojson')
   .then(r=>r.json()).then(j=>{if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error('sem rota');const rt=j.routes[0];
    return{ll:rt.geometry.coordinates.map(c=>[c[1],c[0]]),legs:null,legKm:rt.legs[0].distance/1000,legMin:rt.legs[0].duration/60,totKm:rt.distance/1000,totMin:rt.duration/60}});
 }
 /* Economia de créditos: a rota completa só é calculada quando a lista de paradas muda.
    Enquanto o entregador anda, só o trecho até a próxima parada é recalculado (1 crédito). */
 function fetchRoute(){
  const stops=dStops();
  if(!stops.length){dLayer.clearLayers();dTxt='';dTail=null;setInfo();return}
  const from=dPos||BASE;dLast=Date.now();dLastPos=from;const my=++dSeq;
  const sig=stops.map(o=>o.id).join(',');
  const live=!!(dTail&&dTail.sig===sig);
  const pts=[from].concat(stops.map(pt));
  if(live){
   routeCall([from,pt(stops[0])]).then(r=>{if(my!==dSeq)return;
    drawRoute(r.ll.concat(dTail.ll),r.legKm,r.legMin,r.legKm+dTail.km,r.legMin+dTail.min,false)})
   .catch(()=>{/* mantém a linha anterior; tenta de novo no próximo movimento */});
   return;
  }
  routeCall(pts).then(r=>{if(my!==dSeq)return;
   dTail=r.legs?{sig,ll:[].concat(...r.legs.slice(1).map(l=>l.ll)),km:r.legs.slice(1).reduce((a,l)=>a+l.km,0),min:r.legs.slice(1).reduce((a,l)=>a+l.min,0)}:null;
   drawRoute(r.ll,r.legKm,r.legMin,r.totKm,r.totMin,false)})
  .catch(()=>{if(my!==dSeq)return;dTail=null;drawRoute(pts,null,null,0,0,true)});
 }
 function updateMap(){
  if(!dm){dm=L.map('dmap').setView(BASE,12);dTile=window.__dTile=L.tileLayer(tileUrl(),TILE_OPTS).addTo(dm);
   dLayer=L.layerGroup().addTo(dm);dMk=L.layerGroup().addTo(dm);setTimeout(()=>dm.invalidateSize(),200);
   const FS=L.Control.extend({options:{position:'topright'},onAdd(){const b=L.DomUtil.create('button','dfs');b.textContent='⛶ Tela cheia';L.DomEvent.disableClickPropagation(b);
    b.onclick=()=>{const el=document.getElementById('dmap'),on=el.classList.toggle('dfull');b.textContent=on?'✕ Voltar aos pedidos':'⛶ Tela cheia';setTimeout(()=>dm.invalidateSize(),50)};return b}});
   const FI=L.Control.extend({options:{position:'bottomleft'},onAdd(){const d=L.DomUtil.create('div','dfi');L.DomEvent.disableClickPropagation(d);d.innerHTML=dTxt;return d}});
   dm.addControl(new FS());dm.addControl(new FI());
   new ResizeObserver(()=>dm.invalidateSize()).observe(document.getElementById('dmap'))}
  const st=dStops();dMk.clearLayers();
  st.forEach((o,k)=>L.marker(pt(o),{icon:numIcon(k+1)}).bindTooltip('#'+o.num+' '+o.nome).addTo(dMk));
  if(!dPos)L.marker(BASE,{icon:numIcon('L','#0f766e')}).bindTooltip('Loja').addTo(dMk);
  const sig=st.map(o=>o.id).join(',');
  if(sig!==dSig){dSig=sig;dFit=true;fetchRoute()}
 }
 function buildShell(){
  root.innerHTML=`<div class="drv"><h2>Olá, ${esc(D.nome)}!</h2>
   <div class="warn" id="dinfo" hidden></div><div id="dmap"></div>
   <div class="row" style="margin:0 0 8px"><button id="dctr">Centralizar em mim</button></div><div id="dlist"></div></div>`;
  dShell=true;
  /* localização em tempo real: a rota é recalculada pelas ruas a partir da posição atual */
  if(navigator.geolocation){
   navigator.geolocation.watchPosition(p=>{
    const first=!dPos;dPos=[p.coords.latitude,p.coords.longitude];dGeo='';
    if(dMe)dMe.setLatLng(dPos);else dMe=L.circleMarker(dPos,{radius:9,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(dm);
    if(first)updateMap();
    if(dStops().length&&(first||(dLastPos&&hav(dPos,dLastPos)*1000>80&&Date.now()-dLast>30000)))fetchRoute();
    setInfo();
   },()=>{dGeo='Ative a localização do aparelho para a rota em tempo real. Por enquanto a rota parte da loja.';setInfo()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }else{dGeo='Este aparelho não oferece localização. A rota parte da loja.'}
 }
 const view=()=>{
  const rs=dRoutes();
  document.getElementById('dlist').innerHTML=(rs.length?'':'<div class="empty">Nenhuma rota liberada para você agora.</div>')+
  rs.map(r=>`<div class="rt"><h4><span>Rota ${esc(r.id)}</span><span>${RST[r.status]}</span></h4>
   ${r.status==='confirmada'?`<button class="p" style="width:100%" data-a="ini" data-r="${esc(r.id)}">Iniciar rota</button>`:''}
   ${r.ids.map((id,i)=>{const o=O(id);if(!o)return '';const done=o.status==='finalizado';return `<div class="st" style="align-items:flex-start;${done?'opacity:.5':''}"><i>${i+1}</i><div><b>${esc(o.nome)}</b> ${badge(o.status)}${o.obs&&!done?' <span class="pend">⚠ '+esc(o.obs)+'</span>':''}<br>
    <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a><br>${esc(fullEnd(o))}<br><small>Ref.: ${esc(o.ref)}</small><br><small>${esc(o.itens)}</small>
    ${done?'':`<div class="row"><a href="${gmaps(o)}" target="_blank" rel="noopener"><button>Abrir no Google Maps</button></a>
    ${r.status==='andamento'&&o.status==='rota'?`<button class="p" data-a="ok" data-o="${esc(o.id)}">Concluída</button><button class="d" data-a="pb" data-o="${esc(o.id)}">Problema</button>`:''}</div>`}</div></div>`}).join('')}</div>`).join('');
  updateMap();
 };
 let loading=false;
 async function dLoad(){
  if(loading)return;loading=true;
  try{
   const {data,error}=await sb.rpc('pdv_driver_data');
   if(error)throw error;
   if(!data){root.innerHTML='<div class="drv"><h2>Acesso não liberado</h2><p>Sua conta não está ativa como entregador. Fale com o caixa.</p><button id="dout" style="padding:10px 16px">Sair</button></div>';document.getElementById('dout').onclick=async()=>{await sb.auth.signOut();location.reload()};return}
   const h=JSON.stringify(data);if(h===dHash&&dShell)return;dHash=h;
   D=data.driver;did=D.id;
   if(data.loja){BASE=[data.loja.lat,data.loja.lng]}
   S.orders=(data.orders||[]).map(orderFromDb);S.routes=(data.routes||[]).map(routeFromDb);
   if(!dShell)buildShell();
   view();
  }catch(e){if(!dShell)root.innerHTML='<div class="drv"><h2>Sem conexão</h2><p>Não foi possível carregar. Tentando de novo…</p></div>'}
  finally{loading=false}
 }
 root.addEventListener('click',async e=>{
  if(e.target.id==='dctr'){if(dPos&&dm)dm.setView(dPos,16);else alert('Localização do aparelho ainda não disponível. Ative o GPS e permita o acesso à localização.');return}
  const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;let res;
  if(a==='ini')res=await sb.rpc('pdv_driver_start_route',{p_route:b.dataset.r});
  else if(a==='ok')res=await sb.rpc('pdv_driver_order_action',{p_order:b.dataset.o,p_action:'ok'});
  else if(a==='pb'){const m=prompt('Qual foi o problema na entrega?');if(m===null)return;res=await sb.rpc('pdv_driver_order_action',{p_order:b.dataset.o,p_action:'pb',p_obs:m})}
  if(res&&res.error)toast('Não foi possível enviar. Tente de novo.',true);
  dHash='';dLoad();
 });
 function dLogin(msg){
  root.innerHTML='<div class="drv"><div class="lg"><h1>Opção <b>Lanche</b></h1><p>Entregador: entre com o e-mail e a senha que o caixa cadastrou para você.</p><label for="de">E-mail</label><input id="de" type="email" autocomplete="username"><label for="ds">Senha</label><input id="ds" type="password" autocomplete="current-password"><button class="p big" id="dgo">Entrar</button><p class="err" id="derr">'+(msg||'')+'</p></div></div>';
  const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:document.getElementById('de').value.trim(),password:document.getElementById('ds').value});
   if(error){dLogin(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message);return}dStart()};
  document.getElementById('dgo').onclick=go;document.getElementById('ds').onkeydown=e=>{if(e.key==='Enter')go()};
 }
 function dStart(){document.getElementById('sair').hidden=false;dLoad();setInterval(dLoad,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dLoad()})}
 sb.auth.getSession().then(({data})=>{if(data.session)dStart();else dLogin()});

})();
</script></body></html>
