<style>
:root{--bg:#FFF8EE;--bg2:#FBEFDD;--card:#FFFFFF;--ink:#2A1A10;--mut:#7A6A5C;--line:#EADFCE;--pri:#F5A300;--pri2:#FFC74A;--pinks:#2A1A10;--acc:#C8321E;--price:#B4231A;--ok:#1F9D55;--bad:#C8321E;--shadow:0 6px 24px rgba(90,50,10,.10);color-scheme:light}
[data-theme=dark]{--bg:#16110C;--bg2:#1E1710;--card:#241C13;--ink:#FFF3E3;--mut:#B8A892;--line:#372B1E;--pri:#FFB41F;--pri2:#FFC95C;--pinks:#2A1A10;--acc:#FF7A59;--price:#FFB41F;--ok:#4ADE80;--bad:#FF7A59;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--mut);margin:12px 0 5px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .15s}
.b:active{transform:scale(.97)}.b.p{background:var(--pri);border-color:var(--pri);color:var(--pinks)}.b.p:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 40%,transparent)}.b:disabled{opacity:.45}
.b.big{width:100%;padding:15px;font-size:1rem}.b.zap{background:#25D366;border-color:#25D366;color:#06371b}
.ib{width:42px;height:42px;padding:0;border-radius:50%}
/* topo */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.logo{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.3rem;margin-right:auto;text-decoration:none;color:var(--ink)}.logo b{color:var(--pri)}

.cartbtn{position:relative}.cartbtn i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--acc);color:#fff;font:700 .72rem/20px "Plus Jakarta Sans";text-align:center;font-style:normal;padding:0 5px}
.tema .lua{display:none}[data-theme=dark] .tema .sol{display:none}[data-theme=dark] .tema .lua{display:block}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:center;padding:34px 0 22px}
.hero h1{font-size:clamp(2.2rem,6.2vw,3.9rem);line-height:1.02;font-weight:800}.hero h1 em{color:var(--acc);font-weight:600}
.hero p{color:var(--mut);font-size:1.05rem;margin:14px 0 22px;max-width:30em}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.chipsi{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.chipsi span{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px}.chipsi .i{width:15px;height:15px;color:var(--pri)}
.art{position:relative;min-height:290px;display:grid;place-items:center}
.art::before{content:"";position:absolute;width:min(300px,78%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--pri2),var(--pri));opacity:.9}
.art img{position:absolute;width:46%;aspect-ratio:1;object-fit:cover;border-radius:24px;border:5px solid var(--card);box-shadow:var(--shadow)}
.art img:nth-child(1){left:6%;top:6%;transform:rotate(-7deg)}.art img:nth-child(2){right:4%;top:22%;transform:rotate(6deg);width:50%}.art img:nth-child(3){left:20%;bottom:0;transform:rotate(-2deg);width:42%}
.art .big-e{position:relative;font-size:7rem}
.aviso{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:.9rem;margin:6px 0 4px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;margin:14px 0 0;cursor:pointer;font-weight:600;font-size:.9rem}
/* categorias */
.sec h2{font-size:1.5rem;margin:26px 0 12px}
.catrow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}
.cat{flex:none;width:88px;text-align:center;background:none;border:0;cursor:pointer;padding:0}
.cat .ci{width:76px;height:76px;margin:0 auto 6px;border-radius:50%;background:var(--bg2);border:2.5px solid transparent;display:grid;place-items:center;overflow:hidden;font:800 1.6rem Fraunces,Georgia,serif;color:var(--pri);transition:border-color .15s,transform .15s}
.cat .ci img{width:100%;height:100%;object-fit:cover}.cat.on .ci{border-color:var(--pri);transform:scale(1.05)}.cat span{font-size:.8rem;font-weight:600}
/* produtos */
.sbar{position:relative;margin:4px 0 14px}.sbar .i{position:absolute;left:14px;top:12px;color:var(--mut)}.sbar input{padding-left:44px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.pc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .2s}
.pc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.pc:active{transform:scale(.98)}
.pc .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--bg2),color-mix(in srgb,var(--pri) 22%,var(--bg2)));display:grid;place-items:center;font:800 2.6rem Fraunces,Georgia,serif;color:color-mix(in srgb,var(--pri) 70%,var(--ink))}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .pb{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}.pc b{font-size:.95rem;line-height:1.25}.pc .cn{font-size:.74rem;color:var(--mut)}
.pc .pr{margin-top:auto;padding-top:6px;color:var(--price);font-weight:800}.pc .pr small{font-weight:600;color:var(--mut)}
.pc .add{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--pinks);display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 45%,transparent)}
.vazio{color:var(--mut);text-align:center;padding:36px 8px}

main{padding-bottom:110px}footer{border-top:1px solid var(--line);margin-top:36px;padding:22px 0 90px;color:var(--mut);font-size:.85rem;text-align:center}
/* janelas */
dialog{border:0;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh}
dialog[open]{display:flex;flex-direction:column;animation:up .22s ease-out}dialog::backdrop{background:rgba(20,10,0,.55);backdrop-filter:blur(2px)}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){dialog{margin:auto;border-radius:26px}}
.dh{padding:20px 20px 4px}.dh h2{font-size:1.35rem}.db{overflow:auto;padding:0 20px 12px;flex:1}.df{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}.df .b{flex:1}
.gt{font-size:.78rem;color:var(--mut);margin:16px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.opt>span{flex:1}.opt small{color:var(--price);font-weight:700}
.opt.v{cursor:pointer}.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}.opt.on .rd{border-color:var(--pri);background:radial-gradient(var(--pri) 45%,transparent 50%)}
.st{display:flex;align-items:center;gap:10px}.st button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:1.1rem;cursor:pointer}.st b{min-width:20px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px;font-weight:700;cursor:pointer}.seg button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 16%,var(--bg))}
.pags{display:flex;flex-wrap:wrap;gap:8px}.pags button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer}.pags button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 16%,var(--bg))}
.geo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:11px 13px;border:1.5px dashed var(--line);border-radius:14px}.geo small{color:var(--mut);flex-basis:100%}.geo.ok{border-style:solid;border-color:var(--ok);color:var(--ok);font-weight:600}
.sum{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}.sum.t{color:var(--ink);font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.sum.t b{color:var(--price)}
.err{color:var(--bad);font-size:.88rem;font-weight:600;margin:10px 0 0;min-height:1.2em}
/* acompanhamento */
.trk{max-width:560px;margin:0 auto;padding:26px 0}
.trk .hd{text-align:center}.trk .num{font:800 3rem Fraunces,Georgia,serif;color:var(--pri);line-height:1}
.trk .hd h2{font-size:1.5rem;margin:8px 0 4px}.trk .hd p{color:var(--mut);margin:0}
.tl{margin:26px 4px;list-style:none;padding:0}.tl li{position:relative;display:flex;gap:14px;padding-bottom:24px}
.tl li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}.tl li.done::before{background:var(--ok)}
.tl .dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:#fff}
.tl li.done .dot{background:var(--ok);border-color:var(--ok)}.tl li.cur .dot{border-color:var(--pri);background:var(--pri);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pri) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.tl li b{display:block}.tl li span{color:var(--mut);font-size:.84rem}.tl li.idle b{color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.card h3{font-size:1.05rem;margin-bottom:8px}.card .it{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:.92rem}.card .it small{display:block;color:var(--mut)}
.trk .acts{display:grid;gap:10px;margin-top:18px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:22px}.art{min-height:230px;order:-1}.logo{font-size:1.15rem}.pill{display:none}}

$('#ckdlg').onclick=async e=>{

  $('#track').innerHTML=`<div class="hd"><div class="num">#${s.num}</div><h2>${tit}</h2><p>${st===4?'Fale com a loja se tiver dúvidas.':'Esta página se atualiza sozinha.'}</p></div>
   ${st===4?'':`<ol class="tl">${L.map((x,i)=>`<li class="${i<cur?'done':i===cur?'cur':'idle'}"><div class="dot">${i<cur?I('chk'):''}</div><div><b>${x[0]}</b>${i<=cur?`<span>${x[1]}</span>`:''}</div></li>`).join('')}</ol>`}
   <div class="card"><h3>Resumo</h3>${(s.itens||[]).map(i=>`<div class="it"><div>${i.qtd}× ${esc(i.nome)}${(i.adds||[]).length?`<small>+ ${esc(i.adds.map(addTxt).join(', '))}</small>`:''}</div><span>${brl(i.preco*i.qtd)}</span></div>`).join('')}
    ${+s.taxa?`<div class="it"><span>Entrega</span><span>${brl(s.taxa)}</span></div>`:''}<div class="it" style="font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Total · ${esc(s.pag||'')}</span><span style="color:var(--price)">${brl(total)}</span></div></div>
   ${s.pag==='Pix'&&D.cfg.pix&&st<3?`<div class="card"><h3>Pagamento por Pix</h3><div style="font-weight:800;font-size:1.1rem;word-break:break-all">${esc(D.cfg.pix)}</div><button class="b" id="cpx" style="margin-top:10px">Copiar chave</button></div>`:''}
   <div class="acts">${z?`<a class="b zap big" target="_blank" rel="noopener" href="https://wa.me/${z}?text=${encodeURIComponent('Olá! Sobre o meu pedido #'+s.num+' ('+(s.cliente||'')+').')}">${I('zap')}Falar com a loja no WhatsApp</a>`:''}
    <button class="b" id="clk">Copiar link de acompanhamento</button><button class="b p big" id="novo">${st>=3?'Fazer novo pedido':'Voltar ao cardápio'}</button></div>`;
  const c=$('#cpx');if(c)c.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(String(D.cfg.pix)).then(()=>c.textContent='Chave copiada ✓');
  $('#clk').onclick=e=>navigator.clipboard&&navigator.clipboard.writeText(trkUrl(id)).then(()=>e.target.textContent='Link copiado ✓');
  $('#novo').onclick=()=>{clearInterval(tm);history.replaceState(null,'',location.pathname);$('#track').hidden=true;$('#home').hidden=false;render();banner()};
  if(st>=3)clearInterval(tm);
}
async function abreTrack(id){
  $('#home').hidden=true;$('#track').hidden=false;$('#cartbar').hidden=true;window.scrollTo(0,0);
  history.replaceState(null,'','#acompanhar='+id);
  const poll=async()=>{const{data}=await sb.rpc('pdv_status_pedido',{p_id:id});if(data)pintaTrack(data,id);else if(!TR){$('#track').innerHTML='<div class="vazio">Não encontrei esse pedido. Confira o link.</div>';clearInterval(tm)}TR=data||TR};
  TR=null;clearInterval(tm);await poll();tm=setInterval(poll,10000);
}
async function banner(){
  const u=ld('ol_ult');if(!u||Date.now()-u.t>12*36e5){$('#banner').hidden=true;return}
  const{data}=await sb.rpc('pdv_status_pedido',{p_id:u.id});
  if(!data||data.status>=3){$('#banner').hidden=true;return}
  $('#banner').hidden=false;$('#banner').innerHTML=`<span>Pedido #${data.num} · ${data.status===2?'saiu para entrega':'em preparo'}</span><span>Acompanhar →</span>`;$('#banner').onclick=()=>abreTrack(u.id);
}

/* eventos */
$('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){catSel=b.dataset.c;render();const m=$('#menu');if(scrollY>m.offsetTop)scrollTo({top:m.offsetTop,behavior:'smooth'})}};
$('#q').oninput=render;
$('#lista').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=D.prod.find(x=>x.id===b.dataset.p);if(!p)return;
  if((p.vars||[]).length||gruposDe(p).length)abreOpt(p);else{poe({pid:p.id,varId:'',adds:{},obs:'',qtd:1});toast('Adicionado ✓');if(navigator.vibrate)navigator.vibrate(15)}};
(async()=>{
  if(!sb){$('#lista').innerHTML='<div class="vazio" style="grid-column:1/-1">Sem internet. Conecte-se e atualize a página.</div>';return}
  await load();setInterval(load,60000);
  const m=location.hash.match(/^#acompanhar=([0-9a-f-]{36})$/i);
  if(m)abreTrack(m[1]);else banner();
})();
</script>
</body>
